<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Товар | TAB</title>
<link rel="stylesheet" href="css/style.css">
</head>
<div id="cartOverlay" class="cart-overlay"></div>

<body>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- КНОПКА КОРЗИНЫ -->
<button class="cart-toggle" onclick="toggleCart()">
    🛒
    <span id="cartCounter" class="cart-counter"></span>
</button>

<!-- ПАНЕЛЬ КОРЗИНЫ -->
<div class="cart-panel" id="cartPanel">

    <button class="close-btn" onclick="toggleCart()">✖</button>

    <h2>Корзина</h2>

    <button onclick="clearCart()" class="product-btn clear-cart">
        Очистить корзину
    </button>

    <div id="cart-items"></div>
    <div id="total" class="total">Итого: 0 ₽</div>

    <div class="checkout-form">
        <input type="text" id="fullname" placeholder="ФИО">
        <input type="text" id="city" placeholder="Город">
        <input type="text" id="street" placeholder="Улица">
        <input type="text" id="house" placeholder="Дом">
        <input type="text" id="apartment" placeholder="Квартира">
        <input type="tel" id="phone" placeholder="Номер телефона">
    </div>

    <button class="checkout-fixed" onclick="checkout()">
        Оформить заказ
    </button>

</div>

<header>
    <a href="index.html" class="back-btn">← Назад</a>
</header>

<section class="product-page">

    <div class="product-gallery">
        <img id="productImage" alt="">
    </div>

    <div class="product-info">
        <h2 id="productName"></h2>
        <p class="price" id="productPrice"></p>

        <p class="desc">
            Премиальный streetwear. Лимитированная коллекция TAB.
        </p>

        <button id="addToCartBtn" class="product-btn">
            В корзину
        </button>

    </div>

</section>

<script type="module" src="js/main.js"></script>

</body>
</html>
